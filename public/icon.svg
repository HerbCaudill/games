<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Four square tiles that run to the edges; the dark background shows only in the gaps. -->
  <rect width="512" height="512" fill="#23201d" />

  <!-- Crossword: a checkerboard -->
  <rect x="125" y="0" width="125" height="125" fill="#f4f1ea" />
  <rect x="0" y="125" width="125" height="125" fill="#f4f1ea" />

  <!-- Letter Boxed: a square on coral -->
  <rect x="262" y="0" width="250" height="250" fill="#f5786d" />
  <rect x="329" y="67" width="116" height="116" fill="#f7f2ee" stroke="#23201d" stroke-width="16" />

  <!-- Spelling Bee: a hexagon on yellow -->
  <rect x="0" y="262" width="250" height="250" fill="#f2c94c" />
  <polygon
    points="125 323 180.4 355 180.4 419 125 451 69.6 419 69.6 355"
    fill="#f7f2ee"
    stroke="#23201d"
    stroke-width="16"
  />

  <!-- Pips: a die -->
  <rect x="262" y="262" width="250" height="250" fill="#f7f2ee" />
  <circle cx="387" cy="387" r="26" fill="#23201d" />
  <circle cx="325.4" cy="448.6" r="26" fill="#23201d" />
  <circle cx="448.6" cy="325.4" r="26" fill="#23201d" />
</svg>
